name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Workspace packages ship compiled types (dist/*.d.ts), so the dependency
      # build must run before any consumer's typecheck.
      - name: Build workspaces
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Dist freshness (committed dist must match sources)
        run: npm run check-dist

      - name: Tests
        run: npm test

      - name: Doctor smoke (must name every requirement, never throw)
        run: node runner/dist/cli.js doctor --json || true
